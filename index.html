<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анамның дүкені</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600&family=Cormorant+Garamond:wght@500;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --main:#1f2a44;
  --accent:#c9a227;
  --bg:#f7f5f0;
  --text:#1d2433;
  --muted:#6b7280;
  --card:#ffffff;
  --font:'Inter',sans-serif;
  --head:'Playfair Display',serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit}
input,textarea,select{width:100%;font-size:14px;padding:9px 11px;border:1px solid #d9d4c7;border-radius:10px;margin:4px 0 10px;background:#fff;color:var(--text)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}

/* Жалпы батырмалар */
.mini{width:auto;background:transparent;border:1px solid var(--main);color:var(--main);border-radius:8px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;transition:all .2s}
.mini:hover{background:var(--main);color:#fff}
.danger{border-color:#b42318;color:#b42318}
.danger:hover{background:#b42318;color:#fff}

/* Тақырып */
header{position:relative;text-align:center;padding:56px 20px 36px;background:linear-gradient(180deg,var(--main) 0%,#2b3a5e 100%);color:#fff;overflow:hidden}
header::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);width:160px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:glow 3.5s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.4;width:120px}50%{opacity:1;width:260px}}
.shop-name{font-family:var(--head);font-size:40px;font-weight:700;letter-spacing:.5px;animation:fadeDown .9s ease both}
.bio{max-width:560px;margin:12px auto 0;opacity:.85;font-size:15px;line-height:1.6;animation:fadeDown 1.1s ease both}
@keyframes fadeDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

/* Баннер */
.banner{position:relative;margin:28px auto 0;max-width:1100px;padding:44px 28px;border-radius:18px;text-align:center;color:#fff;background:linear-gradient(120deg,#1f2a44,#34466e,#1f2a44);background-size:220% 220%;animation:shimmer 12s ease infinite;border:1px solid rgba(201,162,39,.35);box-shadow:0 18px 40px rgba(31,42,68,.18)}
@keyframes shimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.banner h1{margin:0 0 10px;font-family:var(--head);font-size:30px;font-weight:700;color:#fff}
.banner p{margin:0 0 22px;font-size:16px;opacity:.9}
.btn-big{display:inline-block;background:var(--accent);color:#1f2a44;padding:13px 28px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;transition:transform .25s,box-shadow .25s;box-shadow:0 6px 16px rgba(201,162,39,.35)}
.btn-big:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(201,162,39,.45)}

/* Тауарлар */
.section-title{text-align:center;margin:48px 0 6px;font-family:var(--head);font-size:26px;color:var(--main)}
.section-line{width:60px;height:2px;background:var(--accent);margin:0 auto 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px;padding:0 20px 40px;max-width:1100px;margin:0 auto}
.card{position:relative;background:var(--card);border-radius:16px;overflow:hidden;border:1px solid #ebe6d8;box-shadow:0 4px 14px rgba(31,42,68,.05);transition:transform .35s ease,box-shadow .35s ease}
.card:hover{transform:translateY(-6px);box-shadow:0 16px 32px rgba(31,42,68,.12)}
.grid.anim .card{animation:fadeUp .7s ease both;animation-delay:calc(var(--i) * .09s)}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.media{width:100%;aspect-ratio:1/1;background:linear-gradient(160deg,#f3efe4,#e9e3d2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}
.card:hover .media img{transform:scale(1.04)}
.media .emo{font-size:72px;transition:transform .5s}
.card:hover .media .emo{transform:scale(1.08) rotate(-4deg)}
.body{padding:18px 20px 22px;text-align:left}
.card h3{font-family:var(--head);font-size:18px;font-weight:700;margin:0 0 6px;color:var(--main)}
.card .d{font-size:13px;color:var(--muted);line-height:1.5;min-height:38px}
.badge{position:absolute;top:14px;right:14px;background:var(--accent);color:#1f2a44;font-weight:700;border-radius:999px;padding:4px 11px;font-size:12px;letter-spacing:.3px;z-index:1}
.price{margin:14px 0 16px;font-size:20px;font-weight:700;color:var(--main)}
.old{text-decoration:line-through;color:var(--muted);font-size:14px;margin-right:8px;font-weight:400}
.order{background:var(--main);color:#fff;border:none;border-radius:10px;padding:12px 18px;font-weight:600;font-size:14px;width:100%;cursor:pointer;transition:background .25s,transform .2s}
.order:hover{background:var(--accent);color:#1f2a44;transform:translateY(-1px)}
.empty{text-align:center;color:var(--muted);grid-column:1/-1;padding:40px 0}

/* Футер */
footer{background:var(--main);color:#e8e4d8;text-align:center;padding:36px 20px 80px;line-height:1.9;font-size:14px;position:relative}
footer::before{content:"";display:block;width:60px;height:2px;background:var(--accent);margin:0 auto 22px}
footer b{color:#fff}
footer .mini{border-color:var(--accent);color:var(--accent)}
footer .mini:hover{background:var(--accent);color:#1f2a44}

/* Админ батырмасы */
.adminBtn{position:fixed;bottom:18px;right:18px;width:46px;height:46px;border-radius:50%;border:1px solid var(--accent);background:var(--main);color:var(--accent);box-shadow:0 6px 16px rgba(0,0,0,.2);font-size:18px;opacity:.7;cursor:pointer;z-index:5;transition:opacity .2s,transform .2s}
.adminBtn:hover{opacity:1;transform:scale(1.06)}

/* Тапсырыс модалы */
.modal{position:fixed;inset:0;background:rgba(15,20,35,.55);display:none;align-items:center;justify-content:center;z-index:10;padding:16px;backdrop-filter:blur(3px)}
.modal.open{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.box{background:#fff;border-radius:18px;padding:26px;width:100%;max-width:400px;animation:pop .35s ease}
@keyframes pop{from{transform:translateY(16px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.box h3{font-family:var(--head);margin:0 0 14px;color:var(--main);font-size:20px}
.box label,.admin label{display:block;font-size:13px;color:var(--muted)}
.box .sum{font-size:18px;color:var(--main);font-weight:700}

/* Админ панелі */
.admin{position:fixed;top:0;left:0;height:100%;width:360px;max-width:94vw;background:#fff;box-shadow:6px 0 30px rgba(0,0,0,.18);transform:translateX(-105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);z-index:20;overflow-y:auto;padding:20px;font-size:14px;color:var(--text)}
.admin.open{transform:none}
.admin h4{margin:22px 0 8px;color:var(--main);font-family:var(--head);font-size:16px;padding-bottom:6px;border-bottom:1px solid #ebe6d8}
.prow{background:#faf8f3;border:1px solid #ebe6d8;border-radius:12px;padding:12px;margin-bottom:10px}
.prow .r{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ahead{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:700;color:var(--main);font-family:var(--head)}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:10px;display:block;margin:4px 0 8px;border:1px solid #ebe6d8}
.hint{font-size:12px;color:var(--muted);margin:4px 0 0}

/* Анимацияны азайту (қалаған адамдарға) */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="shop-name" id="shopName"></div>
  <p class="bio" id="bio"></p>
</header>

<section class="banner">
  <h1 id="bTitle"></h1>
  <p id="bSub"></p>
  <a href="#products" class="btn-big">Тауарларды көру</a>
</section>

<h2 class="section-title">Тауарлар</h2>
<div class="section-line"></div>
<main class="grid" id="products"></main>

<footer>
  <div id="footText"></div>
  <div>Kaspi: <b id="fKaspi"></b> <button class="mini" id="copyKaspi">Көшіру</button></div>
  <div><span id="fAddr"></span></div>
  <div><span id="fPhone"></span></div>
</footer>

<button class="adminBtn" id="adminOpen" title="Админ">🔐</button>

<div class="modal" id="modal">
  <div class="box">
    <h3 id="mTitle"></h3>
    <label>Аты-жөніңіз<input id="oName"></label>
    <label>Мекенжайыңыз<textarea id="oAddr" rows="2"></textarea></label>
    <p class="sum">Сома: <span id="oSum"></span></p>
    <p class="hint">Төлем Kaspi картасына аударылады.</p>
    <button class="order" id="oSend">WhatsApp-қа жіберу</button>
    <button class="mini" id="oClose" style="margin-top:10px;width:100%">Жабу</button>
  </div>
</div>

<aside class="admin" id="admin"></aside>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* Firebase конфигурациясы */
const firebaseConfig = {
  apiKey: "AIzaSyAOpzxs64eJnt9O0-mxcyvw44KK7ZZyUN8",
  authDomain: "tai-tai-jasmin1.firebaseapp.com",
  projectId: "tai-tai-jasmin1",
  storageBucket: "tai-tai-jasmin1.firebasestorage.app",
  messagingSenderId: "715389337041",
  appId: "1:715389337041:web:ceddebdd4775b7800f74f0"
};

/* Анаңыздың email-і (админ) */
const ADMIN_EMAIL = "miraalpanoba@gmail.com";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const ref = doc(db, "shop", "main");

const STYLE_DEFAULT = {
  font: "Playfair Display",
  main: "#1f2a44",
  accent: "#c9a227",
  bg: "#f7f5f0"
};

const DEFAULT = {
  shop: "Анамның дүкені",
  bio: "Балаларға арналған сапалы тауарлар мен сүйікті заттар. Әр дүние мұқият таңдалған.",
  bannerTitle: "Тұсау кесер мерекесіне арналған комбо",
  bannerSub: "Сәбиіңіздің алғашқы қадамына дайын болыңыз",
  footer: "Бізбен хабарласыңыз. Рахмет, сізге игі тілектер!",
  kaspi: "4400 0000 0000 0000",
  phone: "77000000000",
  address: "Ақтау қ., Батыр ауданы",
  ...STYLE_DEFAULT,
  products: [
    { id: 1, name: "Тұсау кесер комбосы «Алтын»", price: 15000, disc: 10, emoji: "🎀", desc: "Тұсау, жастық, сувенир", img: "" },
    { id: 2, name: "Тұсау кесер комбосы «Ақ»", price: 12000, disc: 0, emoji: "👶", desc: "Негізгі жиынтық", img: "" }
  ]
};
const FONTS = ["Playfair Display", "Cormorant Garamond", "Montserrat", "Inter"];

let S = structuredClone(DEFAULT);
let user = null;
let saveTimer = null;
let firstPaint = true;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ₸";
const finalPrice = p => p.price * (1 - (p.disc || 0) / 100);

/* Серверден деректі тыңдау */
onSnapshot(ref, snap => {
  if (snap.exists() && !saveTimer) S = { ...DEFAULT, ...snap.data() };
  renderShop();
});

/* Өзгерісті серверге сақтау */
function queueSave() {
  renderShop();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    saveTimer = null;
    try { await setDoc(ref, S); }
    catch (e) { alert("Сақталмады: " + e.message); }
  }, 600);
}

function renderShop() {
  const st = document.documentElement.style;
  st.setProperty("--main", S.main);
  st.setProperty("--accent", S.accent);
  st.setProperty("--bg", S.bg);
  st.setProperty("--font", `'${S.font}', serif`);
  st.setProperty("--head", `'${S.font}', serif`);
  $("shopName").textContent = S.shop;
  $("bio").textContent = S.bio;
  $("bTitle").textContent = S.bannerTitle;
  $("bSub").textContent = S.bannerSub;
  $("footText").textContent = S.footer;
  $("fKaspi").textContent = S.kaspi;
  $("fAddr").textContent = S.address;
  $("fPhone").textContent = "+" + String(S.phone).replace(/\D/g, "");
  document.title = S.shop;

  const grid = $("products");
  grid.classList.toggle("anim", firstPaint);
  if (firstPaint) setTimeout(() => { firstPaint = false; grid.classList.remove("anim"); }, 1500);

  grid.innerHTML = S.products.map((p, i) => `
    <div class="card" style="--i:${i}">
      ${p.disc > 0 ? `<span class="badge">-${Number(p.disc)}%</span>` : ""}
      <div class="media">${p.img ? `<img src="${esc(p.img)}" alt="">` : `<span class="emo">${esc(p.emoji)}</span>`}</div>
      <div class="body">
        <h3>${esc(p.name)}</h3>
        <div class="d">${esc(p.desc)}</div>
        <div class="price">${p.disc > 0 ? `<span class="old">${money(p.price)}</span>` : ""}${money(finalPrice(p))}</div>
        <button class="order" data-order="${esc(p.id)}">Тапсырыс беру</button>
      </div>
    </div>`).join("") || `<p class="empty">Әзірге тауар жоқ</p>`;
}

/* Тапсырыс (WhatsApp) */
let current = null;
$("products").addEventListener("click", e => {
  const b = e.target.closest("[data-order]");
  if (!b) return;
  current = S.products.find(p => String(p.id) === b.dataset.order);
  if (!current) return;
  $("mTitle").textContent = current.name;
  $("oSum").textContent = money(finalPrice(current));
  $("modal").classList.add("open");
});
$("oClose").onclick = () => $("modal").classList.remove("open");
$("modal").onclick = e => { if (e.target.id === "modal") $("modal").classList.remove("open"); };

$("oSend").onclick = () => {
  const name = $("oName").value.trim(), addr = $("oAddr").value.trim();
  if (!name || !addr) { alert("Аты-жөніңіз бен мекенжайыңызды жазыңыз"); return; }
  const msg = `Сәлем! Тапсырыс беремін.\nТауар: ${current.name}\nСома: ${money(finalPrice(current))} (Kaspi)\nАты-жөні: ${name}\nМекенжай: ${addr}`;
  window.open(`https://wa.me/${String(S.phone).replace(/\D/g, "")}?text=${encodeURIComponent(msg)}`, "_blank");
};

$("copyKaspi").onclick = () => {
  navigator.clipboard?.writeText(S.kaspi);
  $("copyKaspi").textContent = "Көшірілді";
  setTimeout(() => $("copyKaspi").textContent = "Көшіру", 1500);
};

/* Фотоны браузерде кішірейтіп, JPEG-ке айналдыру */
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const k = Math.min(1, 360 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", 0.6));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* АДМИН */
function productRows() {
  return S.products.map((p, i) => `
    <div class="prow">
      ${p.img ? `<img class="thumb" src="${esc(p.img)}" alt="">` : ""}
      <label>Фото таңдау<input type="file" accept="image/*" data-photo="${i}"></label>
      <input data-idx="${i}" data-f="emoji" value="${esc(p.emoji)}" title="Emoji">
      <input data-idx="${i}" data-f="name" value="${esc(p.name)}" title="Атауы">
      <div class="r">
        <input type="number" data-idx="${i}" data-f="price" value="${p.price}" title="Баға">
        <input type="number" data-idx="${i}" data-f="disc" value="${p.disc}" title="Скидка %">
      </div>
      <input data-idx="${i}" data-f="desc" value="${esc(p.desc)}" title="Сипаттама">
      <button class="mini danger" data-act="del" data-idx="${i}">Өшіру</button>
    </div>`).join("");
}

function loginHTML() {
  return `
    <div class="ahead"><span>Кіру</span><button class="mini" data-act="close">✕</button></div>
    <label>Email<input id="lEmail" type="email"></label>
    <label>Құпиясөз<input id="lPass" type="password"></label>
    <button class="order" data-act="login">Кіру</button>
    <button class="mini" data-act="forgot" style="margin-top:10px;width:100%">Құпиясөзді ұмыттым</button>
    <p id="lMsg" style="color:#b42318"></p>`;
}

function editorHTML() {
  const f = (k, label) => `<label>${label}<input data-k="${k}" value="${esc(S[k])}"></label>`;
  const a = (k, label) => `<label>${label}<textarea data-k="${k}" rows="2">${esc(S[k])}</textarea></label>`;
  return `
    <div class="ahead"><span>Баптаулар</span><button class="mini" data-act="close">✕</button></div>

    <h4>Дүкен</h4>
    ${f("shop", "Дүкен атауы")}
    ${a("bio", "Био")}
    ${f("bannerTitle", "Баннер тақырыбы")}
    ${a("bannerSub", "Баннер сипаттамасы")}

    <h4>Байланыс және төлем</h4>
    ${f("kaspi", "Kaspi карта нөмірі")}
    ${f("phone", "WhatsApp нөмірі (77xxxxxxxxx)")}
    ${f("address", "Мекенжай")}
    ${a("footer", "Футер мәтіні")}

    <h4>Стиль</h4>
    <label>Қаріп
      <select data-k="font">${FONTS.map(x => `<option ${x === S.font ? "selected" : ""}>${x}</option>`).join("")}</select>
    </label>
    <label>Негізгі түс <input type="color" data-k="main" value="${S.main}"></label>
    <label>Акцент түсі <input type="color" data-k="accent" value="${S.accent}"></label>
    <label>Фон түсі <input type="color" data-k="bg" value="${S.bg}"></label>
    <button class="mini" data-act="resetstyle" style="width:100%">Бастапқы стильге қайтару</button>

    <h4>Тауарлар</h4>
    <div id="plist">${productRows()}</div>

    <h4>Жаңа тауар қосу</h4>
    <label>Emoji<input id="nEmoji" value="🧸"></label>
    <label>Атауы<input id="nName"></label>
    <label>Баға (₸)<input id="nPrice" type="number"></label>
    <label>Скидка %<input id="nDisc" type="number" value="0"></label>
    <label>Сипаттама<input id="nDesc"></label>
    <button class="order" data-act="add">Қосу</button>

    <h4>Басқа</h4>
    <button class="mini" data-act="logout" style="width:100%">Шығу</button>`;
}

function openAdmin() {
  $("admin").innerHTML = user ? editorHTML() : loginHTML();
  $("admin").classList.add("open");
}

$("adminOpen").onclick = openAdmin;

onAuthStateChanged(auth, u => {
  if (u && u.email !== ADMIN_EMAIL) { signOut(auth); return; }
  user = u;
  if ($("admin").classList.contains("open")) openAdmin();
});

/* Мәтін, түс, қаріп өзгерісі */
$("admin").addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.k) { S[t.dataset.k] = t.value; queueSave(); }
  if (t.dataset.idx !== undefined && t.dataset.f) {
    const p = S.products[+t.dataset.idx];
    p[t.dataset.f] = ["price", "disc"].includes(t.dataset.f) ? Number(t.value) || 0 : t.value;
    queueSave();
  }
});

/* Фото таңдалғанда */
$("admin").addEventListener("change", async e => {
  const t = e.target;
  if (t.type !== "file" || t.dataset.photo === undefined || !t.files[0]) return;
  try {
    const url = await compressImage(t.files[0]);
    if (url.length > 300000) { alert("Фото тым үлкен, басқа сурет таңдаңыз"); return; }
    S.products[+t.dataset.photo].img = url;
    queueSave();
    $("plist").innerHTML = productRows();
  } catch (err) {
    alert("Фото жүктелмеді: " + err.message);
  }
});

/* Батырмалар */
$("admin").addEventListener("click", async e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;

  if (act === "close") $("admin").classList.remove("open");

  if (act === "login") {
    try { await signInWithEmailAndPassword(auth, $("lEmail").value.trim(), $("lPass").value); }
    catch { $("lMsg").textContent = "Email немесе құпиясөз қате"; }
  }

  if (act === "forgot") {
    const mail = $("lEmail").value.trim();
    if (!mail) { $("lMsg").textContent = "Алдымен email жазыңыз"; return; }
    try {
      await sendPasswordResetEmail(auth, mail);
      $("lMsg").style.color = "#2a7a4b";
      $("lMsg").textContent = "Құпиясөзді қалпына келтіру сілтемесі поштаға жіберілді";
    } catch { $("lMsg").textContent = "Бұл email табылмады"; }
  }

  if (act === "logout") { await signOut(auth); $("admin").classList.remove("open"); }

  if (act === "resetstyle") {
    Object.assign(S, STYLE_DEFAULT);
    queueSave();
    openAdmin();
  }

  if (act === "del") {
    if (confirm("Бұл тауарды өшіресіз бе?")) {
      S.products.splice(+t.dataset.idx, 1);
      queueSave();
      $("plist").innerHTML = productRows();
    }
  }

  if (act === "add") {
    const name = $("nName").value.trim();
    if (!name) { alert("Атауын жазыңыз"); return; }
    S.products.push({
      id: Date.now(),
      name,
      price: Number($("nPrice").value) || 0,
      disc: Number($("nDisc").value) || 0,
      emoji: $("nEmoji").value || "🧸",
      desc: $("nDesc").value,
      img: ""
    });
    queueSave();
    $("plist").innerHTML = productRows();
    $("nName").value = ""; $("nPrice").value = ""; $("nDesc").value = "";
  }
});

renderShop();
</script>
